<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>メレンゲ工房｜ハンドメイド作品</title>
  <meta
    name="description"
    content="メレンゲ工房のハンドメイド作品ギャラリー。かわいい作品からダークでかっこいい作品まで、一つひとつ心を込めて制作しています。"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fffaf8;
    }

    body {
      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Yu Gothic",
        Meiryo,
        serif;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 1015px;
      margin: 0 auto;
    }

    .page-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .hit {
      position: absolute;
      display: block;
      overflow: hidden;
      color: transparent;
      white-space: nowrap;
      cursor: pointer;
    }

    .hit:focus-visible {
      outline: 3px solid #d98997;
      outline-offset: 2px;
      border-radius: 16px;
    }

    /* 上部メニュー */
    .home {
      left: 53.7%;
      top: 1.8%;
      width: 6%;
      height: 3.4%;
    }

    .works {
      left: 61.4%;
      top: 1.8%;
      width: 7%;
      height: 3.4%;
    }

    .about {
      left: 70.6%;
      top: 1.8%;
      width: 9%;
      height: 3.4%;
    }

    .sns {
      left: 82.7%;
      top: 1.8%;
      width: 11%;
      height: 3.4%;
    }

    /* 作品カテゴリー */
    .c1 {
      left: 8.1%;
      top: 51.1%;
      width: 24.7%;
      height: 10.3%;
    }

    .c2 {
      left: 36.9%;
      top: 51.1%;
      width: 24.7%;
      height: 10.3%;
    }

    .c3 {
      left: 65.6%;
      top: 51.1%;
      width: 24.7%;
      height: 10.3%;
    }

    .c4 {
      left: 8.1%;
      top: 63%;
      width: 24.7%;
      height: 10.3%;
    }

    .c5 {
      left: 36.9%;
      top: 63%;
      width: 24.7%;
      height: 10.3%;
    }

    .c6 {
      left: 65.6%;
      top: 63%;
      width: 24.7%;
      height: 10.3%;
    }

    /* ページ内リンクの移動先 */
    .anchor-point {
      position: absolute;
      left: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    #works {
      top: 48%;
    }

    #about {
      top: 27%;
    }

    #sns {
      top: 87%;
    }
  </style>
</head>

<body>
  <main class="page">
    <img
      class="page-image"
      src="images/homepage-exact.png"
      alt="メレンゲ工房のハンドメイド作品ギャラリー"
    >

    <!-- ページ内リンクの移動先 -->
    <span id="works" class="anchor-point" aria-hidden="true"></span>
    <span id="about" class="anchor-point" aria-hidden="true"></span>
    <span id="sns" class="anchor-point" aria-hidden="true"></span>

    <!-- 上部メニュー -->
    <a class="hit home" href="index.html" aria-label="ホーム">
      ホーム
    </a>

    <a class="hit works" href="#works" aria-label="作品一覧">
      作品一覧
    </a>

    <a class="hit about" href="#about" aria-label="工房について">
      工房について
    </a>

    <a class="hit sns" href="#sns" aria-label="ショップ・SNS">
      ショップ・SNS
    </a>

    <!-- 作品カテゴリー -->
    <a
      class="hit c1"
      href="tsumami-fabric.html"
      aria-label="つまみ細工（布）"
    >
      つまみ細工（布）
    </a>

    <a
      class="hit c2"
      href="tsumami-paper.html"
      aria-label="つまみ細工（紙）"
    >
      つまみ細工（紙）
    </a>

    <a
      class="hit c3"
      href="key-charm.html"
      aria-label="キーチャーム"
    >
      キーチャーム
    </a>

    <a
      class="hit c4"
      href="beads.html"
      aria-label="ビーズ"
    >
      ビーズ
    </a>

    <a
      class="hit c5"
      href="whip-deco.html"
      aria-label="ホイップデコ（トレカケース）"
    >
      ホイップデコ（トレカケース）
    </a>

    <a
      class="hit c6"
      href="photo-frame.html"
      aria-label="写真立て"
    >
      写真立て
    </a>
  </main>
</body>
</html>
